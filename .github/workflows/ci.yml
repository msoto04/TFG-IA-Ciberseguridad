name: Pipeline de Calidad CI/QA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  revision-y-pruebas:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
    - name: Descargar el código
      uses: actions/checkout@v4

    - name: Configurar Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Comprobar Formateo (Black)
      run: black --check .

    - name: Análisis estático (Ruff Linter)
      run: ruff check .

    - name: 🧪 Ejecutar Pruebas Unitarias (Pytest)
      env:
        PYTHONPATH: .
        REDIS_URL: redis://localhost:6379/0
        UPLOAD_DIR: ./uploads
        EXTRACT_DIR: ./auditoria_temp
      run: pytest tests/