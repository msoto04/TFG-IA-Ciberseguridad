services:
  frontend:
    image: nginx:alpine
    container_name: secureaudit-frontend
    ports:
      - "3000:80"
    volumes:
      - ./Frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend

  backend:
    build: .
    container_name: secureaudit-backend
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - secureaudit_data:/app/data
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway" 
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:alpine
    container_name: secureaudit-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build: .
    container_name: secureaudit-worker
    command: celery -A Src.workers.celery_worker.celery_app worker --loglevel=info
    volumes:
      - ./:/app
      - secureaudit_data:/app/data
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  secureaudit_data:
    driver: local